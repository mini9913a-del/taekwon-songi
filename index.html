<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한 번만 부딪혀도 끝! 숨은 함정을 외워서 돌파하는 태권도 러닝 게임">
<meta name="theme-color" content="#1f1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<title>태권송이의 대모험</title>

<style>
/* Layout: one centered column — title row, game screen, controls. Deliberately single-theme: a dark dojo frame around a bright game world. */
:root{
  --ink:#1f1a24; --ink-2:#2d2633; --line:#4a4152;
  --paper:#f7f2ea; --muted:#b9afc2; --red:#e5534b; --gold:#f2b544;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2;margin:0;color:var(--paper);text-wrap:balance}
h1 span{color:var(--red)}
header p{margin:0;color:var(--muted);font-size:14px;min-width:0}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:5/3;border-radius:14px;overflow:hidden;background:#0f0c12;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--gold)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.hint{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;min-width:0}
.hint.touch{display:none}
kbd{font-family:var(--font-display);font-size:13px;background:var(--ink-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--paper)}
.actions{display:flex;gap:8px}
button{font-family:var(--font-display);font-size:15px;color:var(--paper);background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;-webkit-user-select:none;user-select:none}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (hover:none) and (pointer:coarse){.hint.keys{display:none}.hint.touch{display:flex}}
.testbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px dashed var(--gold);border-radius:10px;font-family:var(--font-display);font-size:14px}
.testbar .tag{color:var(--ink);background:var(--gold);border-radius:6px;padding:1px 8px}
.testbar select{font-family:var(--font-display);font-size:15px;color:var(--paper);background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.testbar .chk{display:flex;align-items:center;gap:4px;cursor:pointer}
/* Full-screen mode (class set by script): installed app, or a phone held sideways — only the game, no frame */
html.full,html.full body{height:100%;overflow:hidden;overscroll-behavior:none;background:#000}
html.full body{padding:0}
html.full header,html.full .bar{display:none}
html.full .wrap{max-width:none;margin:0;gap:0}
html.full .screen{position:fixed;inset:0;width:100vw;max-width:none;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none;background:#000;
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
html.full canvas{flex:none}
.rotate-hint{display:none}
@media (orientation:portrait){html.full .rotate-hint{display:block;position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-family:var(--font-display);font-size:15px}}
</style>
<style>html{-webkit-text-size-adjust:100%}*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}.pwa-hint{color:var(--muted);font-size:13px;width:100%}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span>태권송이</span>의 대모험</h1>
    <p>한 번만 부딪혀도 끝! 100개 스테이지, 숨은 함정을 외워서 돌파하세요.</p>
  </header>
  <div class="screen"><canvas id="game" tabindex="0" aria-label="태권송이의 대모험 게임 화면"></canvas><div class="rotate-hint">폰을 가로로 돌리면 화면이 꽉 차요</div></div>
  <div class="bar">
    <div class="hint keys">
      <span><kbd>Space</kbd> 점프 · 공중에서 한 번 더 = 이단 점프</span>
      <span><kbd>↓</kbd> 누르고 있기 슬라이드</span>
      <span><kbd>→</kbd> 발차기</span>
      <span><kbd>←</kbd> 뒤로 피하기</span>
      <span><kbd>P</kbd> 일시정지</span>
    </div>
    <div class="hint touch">
      <span>탭 = 점프 · 공중에서 한 번 더 = 이단 점프</span>
      <span>아래로 쓸고 유지 = 슬라이드</span>
      <span>오른쪽으로 쓸기 = 발차기</span>
      <span>왼쪽으로 쓸기 = 뒤로 피하기</span>
    </div>
    <div class="testbar" id="testbar" hidden>
      <span class="tag">테스트 모드</span>
      <label for="stageSel">스테이지</label>
      <select id="stageSel"></select>
      <button id="stageGo">시작</button>
      <label class="chk"><input type="checkbox" id="godChk"> 무적</label>
    </div>
    <div class="actions">
      <button id="mute">소리 끄기</button>
      <button id="restart">STAGE 1부터</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
let VW=800;
const VH=480,GROUND=404,PX=170;
const GRAV=0.62,JUMP=-12.4,JUMP2=-10.8;
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const C_PAPER='#fff8ee',C_GOLD='#f2b544',C_RED='#e5534b',C_MUTED='#b9afc2',C_INK='#1f1a24';
const cv=document.getElementById('game');
let ctx=cv.getContext('2d');const MAINCTX=ctx;let DPRV=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// The view is always 480 units tall; width follows the screen shape (wider phones see further ahead).
// Full-screen when installed as an app, or on a phone held sideways.
const mqLand=window.matchMedia('(orientation:landscape) and (max-height:540px) and (pointer:coarse)');
const mqApp=window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)');
function isFull(){return mqLand.matches||mqApp.matches||window.navigator.standalone===true;}
function fit(){
  const full=isFull();
  document.documentElement.classList.toggle('full',full);
  const d=Math.min(window.devicePixelRatio||1,2);
  if(full){
    // fill the screen; wide screens see further ahead (up to 1100 units), anything else is letterboxed, never stretched
    const box=cv.parentElement.getBoundingClientRect(),cs=getComputedStyle(cv.parentElement);
    const W=box.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=box.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    VW=Math.round(clamp(VH*(W/H),800,1100));
    const cw=Math.min(W,H*VW/VH);
    cv.style.width=cw+'px';cv.style.height=(cw*VH/VW)+'px';
  }else{
    cv.style.width='';cv.style.height='';
    const r=cv.getBoundingClientRect();
    VW=Math.round(clamp(VH*(r.width>0&&r.height>0?r.width/r.height:5/3),800,1100));
  }
  DPRV=d;cv.width=Math.round(VW*d);cv.height=Math.round(VH*d);ctx.setTransform(d,0,0,d,0,0);
}
fit();
[mqLand,mqApp].forEach(m=>{try{m.addEventListener('change',fit);}catch(e){m.addListener(fit);}});
window.addEventListener('resize',()=>requestAnimationFrame(fit));
window.addEventListener('orientationchange',()=>setTimeout(fit,250));
const coarse=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

/* ---------- audio ---------- */
let actx=null,muted=false;
function audioInit(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){actx.resume().catch(()=>{});}
}
function tone(f1,f2,dur,type,vol){
  if(muted||!actx)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.03);
}
const SFX={
  jump:()=>tone(360,720,0.13,'square',0.04),
  jump2:()=>tone(520,1100,0.12,'square',0.045),
  kick:()=>tone(700,260,0.12,'triangle',0.08),
  slide:()=>tone(300,120,0.18,'triangle',0.07),
  heal:()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,0.1,'triangle',0.07),i*70)),
  hit:()=>tone(300,70,0.35,'sawtooth',0.07),
  smash:()=>{tone(180,60,0.18,'square',0.1);setTimeout(()=>tone(1200,1600,0.08,'square',0.04),60);},
  warn:()=>tone(880,880,0.06,'square',0.03),
  back:()=>tone(520,300,0.1,'triangle',0.06),
  horn:()=>{tone(440,440,0.12,'square',0.05);setTimeout(()=>tone(440,440,0.16,'square',0.05),150);},
  flap:()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(900+Math.random()*400,300,0.05,'triangle',0.04),i*45);},
  attn:()=>{tone(300,280,0.18,'square',0.07);setTimeout(()=>tone(520,500,0.3,'square',0.07),220);},
  rest:()=>tone(500,380,0.18,'triangle',0.05),
  fake:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,0.12,'square',0.045),i*110)),
  pop:()=>tone(160+Math.random()*120,50,0.25,'triangle',0.06),
  whistle:()=>tone(1600,450,0.6,'sine',0.045),
  crash:()=>{tone(260,70,0.25,'square',0.08);setTimeout(()=>tone(1800,900,0.08,'square',0.03),30);},
  clang:()=>{tone(1400,1300,0.25,'square',0.05);setTimeout(()=>tone(220,90,0.3,'sawtooth',0.07),40);},
  zap:()=>{tone(1800,80,0.5,'sawtooth',0.09);setTimeout(()=>tone(120,40,0.6,'square',0.1),60);},
  clear:()=>[659,784,1046,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,0.15,'square',0.045),i*120)),
  over:()=>[440,370,311,262].forEach((f,i)=>setTimeout(()=>tone(f,f*0.98,0.22,'triangle',0.08),i*180))
};

/* ---------- belts & stages ---------- */
/* Stage n is run wearing belt n; clearing it promotes to belt n+1. 품띠 = red over black. */
const BELTS=[['흰띠','#f6f4ee'],['노란띠','#f4c534'],['주황띠','#f08a2c'],['초록띠','#45a85a'],['파란띠','#3a7bd5'],['보라띠','#8a55c9'],['밤띠','#7a4a2c'],['빨간띠','#e0453c'],['품띠',['#e0453c','#1d1d1d']],['검은띠','#1d1d1d']];
/* Stages 1–5: jump / double jump / slide only, ramping speed and combos.
   Stages 6–10: same backgrounds as 1–5, plus flying boards that home in on Songi's height, so only a kick breaks them.
   One life: any hit ends the run. */
const STAGES=[
  {name:'아침 공원',theme:'park',len:8000,speed:[5.2,6.0],react:[84,66],seed:11,tutorial:true,
   pats:{cone:3,pit:3,bar:3,'wide-pit':1,tall:1}},
  {name:'놀이터 가는 길',theme:'park',len:9000,speed:[5.7,6.6],react:[74,60],seed:12,
   pats:{cone:2,pit:2,bar:2,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2}},
  {name:'노을 강변',theme:'river',len:10000,speed:[6.2,7.2],react:[68,54],seed:13,
   pats:{cone:2,pit:2,bar:2,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':2,'double-bar':1}},
  {name:'강변 다리',theme:'river',len:11000,speed:[6.7,7.7],react:[62,50],seed:14,
   pats:{cone:1,pit:1,bar:1,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':2,'double-bar':2,'cone-cone':2,'pit-pit':2,'tall-bar':1}},
  {name:'밤의 골목',theme:'night',len:12000,speed:[7.2,8.3],react:[56,46],seed:15,
   pats:{'wide-pit':3,tall:3,'jump-slide':3,'slide-jump':3,'pit-slide':3,'double-bar':2,'cone-cone':2,'pit-pit':2,'tall-bar':2}},
  {name:'바람 부는 공원',theme:'park',len:10000,speed:[6.6,7.4],react:[68,56],seed:16,flyTutorial:true,fly:3.4,
   pats:{fly:4,cone:2,pit:2,bar:2,'wide-pit':2,tall:1,'jump-slide':1}},
  {name:'놀이터 지름길',theme:'park',len:11000,speed:[7.0,7.9],react:[62,52],seed:17,fly:3.8,
   pats:{fly:3,'fly-fly':1,'cone-fly':2,'pit-fly':1,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':1}},
  {name:'해 질 녘 강변',theme:'river',len:12000,speed:[7.4,8.4],react:[58,48],seed:18,fly:4.2,
   pats:{fly:2,'fly-fly':2,'cone-fly':2,'pit-fly':2,'fly-bar':2,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':2,'double-bar':1}},
  {name:'긴 다리',theme:'river',len:13000,speed:[7.8,8.9],react:[54,45],seed:19,fly:4.6,
   pats:{fly:2,'fly-fly':3,'cone-fly':2,'pit-fly':3,'fly-bar':3,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':2,'double-bar':1,'pit-pit':1,'tall-bar':1}},
  {name:'심사 가는 밤길',theme:'night',len:15000,speed:[8.2,9.5],react:[50,42],seed:20,fly:5,
   pats:{fly:1,'fly-fly':3,'cone-fly':3,'pit-fly':3,'fly-bar':3,'wide-pit':2,tall:2,'jump-slide':2,'slide-jump':2,'pit-slide':2,'double-bar':2,'pit-pit':2,'tall-bar':2,'cone-cone':1}}
];
/* Stages 11+: black-belt 실전 (real fights). Every 10 stages a new trap joins the pool and stays:
   11–20 sticky floor (landing = stuck, needs a longer double jump) · 21–30 + lightning (double jump inside a hidden zone = struck)
   31–40 + iron plates (don't kick) · 41–50 + ice (no jumping on it). */
const BB_NAMES=['끈적한 공원','꿀 흘린 놀이터','찐득 강변','거미줄 다리','엿가락 골목','조청 공원','껌 붙은 놀이터','슬라임 강변','끈끈이 다리','끈끈이 심사',
                '번쩍 공원','우르릉 놀이터','천둥 강변','벼락 다리','번개 골목','찌릿 공원','정전기 놀이터','폭풍 강변','낙뢰 다리','벼락 심사',
                '쇳소리 공원','철판 놀이터','녹슨 강변','강철 다리','대장간 골목','무쇠 공원','철공소 놀이터','은빛 강변','쇠기둥 다리','철판 심사',
                '살얼음 공원','얼음 놀이터','꽁꽁 강변','빙판 다리','고드름 골목','서리 공원','미끄럼 놀이터','얼어붙은 강변','눈보라 다리','빙판 심사',
                '화분 공원','베란다 놀이터','떨어지는 강변','머리 위 다리','창문 골목','화단 공원','옥상 놀이터','낙하 강변','빌라 다리','낙하물 심사',
                '비둘기 공원','모이 주는 놀이터','구구 강변','비둘기 다리','참새 골목','깃털 공원','푸드덕 놀이터','비둘기 강변','광장 다리','비둘기 심사',

const BB_THEMES=['park','park','river','river','night'];
const BASE_PATS={fly:1,'fly-fly':1,'cone-fly':1,'pit-fly':1,'fly-bar':1,'wide-pit':1,tall:1,'jump-slide':1,'slide-jump':1,'pit-slide':1,'double-bar':1,'pit-pit':1,'tall-bar':1};
const TRAP_PATS=[
  {sticky:2,'cone-sticky':4,'pit-sticky':3,'sticky-bar':2,'sticky-fly':2},
  {'zap-pit':4,'zap-cones':3,'zap-fly':2,'zap-sticky':2},
  // 31–40 iron plate: looks like a board, but kicking it (or getting hit) fails — dodge it instead

  {'pot':3,'pot-pot':2,'cone-pot':2,'pot-cone':2,'pot-fly':2,'ice-pot':2},

  {'pigeon':3,'cone-pigeon':3,'pigeon-pot':2,'pigeon-fly':2,'pigeon-bar':2},

  {'moto':3,'moto-pot':2,'moto-cone':2,'moto-fly':2},

const OBS={cone:{w:28,h:36},tall:{w:38,h:134},bar:{w:64}};
const BALLOON=['#ff5d73','#ffb000','#3ec1d3','#7bd389','#a77bff','#ff8fd0','#ff7a3d','#4d96ff','#ffe156'];

const speedAt=(def,x)=>def.speed[0]+(def.speed[1]-def.speed[0])*clamp(x/def.len,0,1);

function genStage(i){
  const def=STAGES[i],R=rng(def.seed),obs=[],pits=[],items=[],flies=[],sticky=[],zaps=[],ices=[],pots=[],pigeons=[],motos=[],attns=[],decoys=[],fakes=[];
  const lbl=(touch,key)=>coarse?touch:key;
  const add=(t,x,label)=>{

    obs.push(o);return o;};
  const pit=(x,w,label)=>pits.push({a:x,b:x+w,label});
  const goo=(x,w)=>sticky.push({a:x,b:x+w});

  const fly=(m,label,kind,y)=>{const sp=speedAt(def,m),fs=def.fly||4;flies.push({m,x:m+VW+20-PX-sp*(VW+20-PX)/(sp+fs),y:y||GROUND-30,fs,active:false,broken:false,label,kind:kind||'board'});};
  // iron plate: fixed height — high (slide under / jump over) or low (jump over)
  const iron=(m,hi)=>fly(m,null,'iron',hi?GROUND-44:GROUND-18);

    add('tall',4300,lbl('높은 콘 탑 · 이단 점프!','높은 콘 탑 · 이단 점프!'));

  }
  if(def.motoTutorial){moto(1400,false);moto(2600,true);x=3500;}
  if(def.potTutorial){
    pot(1300,lbl('떨어지는 화분 · 왼쪽으로 쓸어 뒤로 피하기!','떨어지는 화분 · ← 키로 뒤로 피하기!'));
    pot(2300,lbl('점프·슬라이드로는 못 피해요','점프·슬라이드로는 못 피해요'));

  }

    fly(1300,lbl('날아오는 송판 · 오른쪽으로 쓸어 발차기!','날아오는 송판 · → 발차기로 격파!'));

  const sx=f.x-dist;
  burst(sx,f.y,14,'#e2b47a',3);
  debris.push({x:sx,y:f.y,vx:3,vy:-6,rot:0,vr:0.25,life:60});
  debris.push({x:sx,y:f.y,vx:5,vy:-3,rot:0,vr:-0.3,life:60});
  floatText(f.x,f.y-40,'격파!',C_GOLD);
}

function updatePlay(){
  const def=S.def,prog=stageProg();
  speed=def.speed[0]+(def.speed[1]-def.speed[0])*prog;
  if(slowT>0){slowT--;speed*=0.55;}
  dist+=speed;
  // 차렷: while the call is active, any input fails
  for(const z of S.attns){
    if(z.state===0){if(dist+PX>=z.a){z.state=1;z.t=0;SFX.attn();}else continue;}
    if(z.state===1&&++z.t>z.dur){z.state=2;SFX.rest();floatText(dist+PX,GROUND-130,'쉬어!','#9be38f');}
  }
  if(attnOn()&&(input.jp||input.kick||input.back||keys.down||touch.gest)){if(attnFail())return;input.jp=input.kick=input.back=false;}
  // backstep: Songi drops back ~70px for a moment, then runs back to her spot
  if(input.back&&P.backCd<=0){P.backT=30;P.backCd=40;P.slide=false;SFX.back();burst(PX,GROUND-2,5,'rgba(240,226,200,.9)',1.2);}
  if(P.backT>0){P.backT--;const q=(30-P.backT)/30;P.ox=-72*(q<0.22?q/0.22:q<0.62?1:1-(q-0.62)/0.38);}else P.ox=0;
  if(P.backCd>0)P.backCd--;
  const wx=dist+PXo();

  if(input.kick)doKick();
  // On ice a touch first waits a few frames: if it turns into a swipe (kick/slide) it is not a jump, so no slip.
  if(pendingSlip>0){
    if(touch.gest)pendingSlip=0;
    else if(touch.id===null||--pendingSlip===0){pendingSlip=0;if(slip())return;}
  }
  if(input.jp&&(P.onGround||P.coyote>0)&&onIce(wx)){
    input.jp=false;
    if(touch.id!==null&&frame-touch.downFrame<=2&&!touch.gest)pendingSlip=9;
    else if(slip())return;
  }
  if(P.buffer>0&&!input.jp&&P.onGround&&onIce(wx)){P.buffer=0;if(slip())return;}
  if(input.jp){
    if(P.onGround||P.coyote>0)doJump1();
    else if(P.jumps<2)doJump2();
    else P.buffer=8;
  }else if(P.buffer>0){P.buffer--;if(P.onGround)doJump1();}

  const want=keys.down||touch.gest==='slide';
  if(want&&P.kickT<=0){
    if(P.onGround){if(!P.slide){P.slide=true;SFX.slide();burst(PX+10,GROUND,5,'rgba(240,226,200,.9)',1.2);}P.slideHold=16;}
    else P.vy=Math.max(P.vy,11);
  }
  if(P.slide&&!want){P.slideHold--;if(P.slideHold<=0)P.slide=false;}

  const prevY=P.y,wasGround=P.onGround;
  P.vy=Math.min(P.vy+GRAV,16);P.y+=P.vy;
  const pit=overPit(wx);
  if(pit)P.lastPit=pit;
  P.onGround=false;
  if(!pit&&P.y>=GROUND&&prevY<=GROUND+1){
    P.y=GROUND;P.vy=0;P.onGround=true;
    if(!wasGround){P.jumps=0;P.spin=0;if(prevY<GROUND-40)burst(PX,GROUND,6,'rgba(240,226,200,.9)',1.2);}
  }
  if(wasGround&&!P.onGround&&P.jumps===0)P.coyote=7;else if(P.coyote>0)P.coyote--;
  if(!P.onGround)P.slide=false;
  if(P.spin>0)P.spin--;
  if(P.kickT>0)P.kickT--;
  if(P.kickCd>0)P.kickCd--;
  if(P.inv>0)P.inv--;
  if(godCd>0)godCd--;
  P.anim+=speed*0.075;
  if(P.y>VH+60){if(pitFall())return;}
  if(pendingZap>0){if(P.jumps<2)pendingZap=0;else if(--pendingZap===0){if(zapNow())return;}}
  if(P.onGround){const g=S.sticky.find(g=>wx>g.a+4&&wx<g.b-4);if(g){g.shown=frame;if(stuck())return;}}

  const hb=hitbox();
  for(const o of S.obs){
    if(o.x>wx+80)break;
    if(o.x+o.w<wx-80)continue;
    if(inter(hb,obsRect(o),3)&&P.inv<=0){hurt();if(state!=='play')return;}
  }

  // flying boards
  const kickZone=P.kickT>=3&&P.kickT<=18?{x:wx+4,y:P.y-58,w:72,h:60}:null;
  for(const f of S.flies){
    if(f.broken)continue;
    if(!f.active){if(f.x<=dist+VW+20)f.active=true;else continue;}
    f.x-=f.fs;
    const isIron=f.kind==='iron';
    if(!isIron){const target=P.slide?P.y-14:P.y-30;f.y+=clamp((target-f.y)*0.1,-3.5,3.5);}
    const r={x:f.x-17,y:f.y-21,w:34,h:42};
    if(kickZone&&inter(kickZone,r,0)){if(isIron){if(ironKick(f))return;continue;}smashFly(f);continue;}
    if(inter(hb,r,4)){f.broken=true;burst(f.x-dist,f.y,8,isIron?'#c9d3dc':'#e2b47a',2);if(P.inv<=0){hurt(isIron?'iron':'hit');if(state!=='play')return;}}
  }
  S.flies=S.flies.filter(f=>!(f.x<dist-120));

  // falling pots: start falling when Songi is T frames away, land exactly where she would be
  for(const q of S.pots){
    if(q.done)continue;
    if(q.t<0){if(q.m-(dist+PX)<=speed*q.T){q.t=0;SFX.whistle();}else continue;}
    q.t++;
    if(q.t<=q.T){
      // aimed phase: the pot arrives at Songi's current body height at the impact frame, so jumping or sliding can't dodge it
      const u=q.t/q.T,ty=P.slide?P.y-14:P.y-30;q.y=-40+(ty+40)*u*u;
    }else{q.vy=(q.vy||10)+0.6;q.y+=q.vy;}
    const r={x:q.m-17,y:q.y-17,w:34,h:34};
    if(inter(hb,r,3)){if(potHit(q))return;continue;}
    if(q.y>=GROUND-17){q.done=true;SFX.crash();burst(q.m-dist,GROUND-10,14,'#c8643b',2.4);burst(q.m-dist,GROUND-10,6,'#5fae57',1.8);}
  }
  // pigeons: on the ground they just scatter; arriving in the air sends them into Songi's face
  for(const g of S.pigeons){
    if(g.state!==0){g.t++;continue;}
    if(wx>g.a-30&&wx<g.b+10){
      if(!P.onGround&&P.y>GROUND-230){g.state=2;g.t=0;if(pigeonHit(g))return;}
      else{g.state=1;g.t=0;SFX.flap();}
    }
  }
  // delivery motorbike coming head-on from the front: enters at the right edge with a horn, only a double jump clears it
  for(const mo of S.motos){
    if(mo.state===0){if(dist+PX>=mo.trig){mo.state=2;mo.t=0;mo.x=dist+VW+30;SFX.horn();floatText(dist+VW-70,GROUND-170,'빵빵!','#ffd27a');}else continue;}
    if(mo.state===3)continue;
    mo.t++;
    if(mo.t===20)SFX.horn();
    mo.x-=3;
    if(frame%3===0)particles.push({x:mo.x+84-dist,y:GROUND-14,vx:1,vy:-0.3,g:-0.01,life:24,max:24,color:'rgba(160,160,170,.6)',r:3});
    if(!mo.hit&&inter(hb,{x:mo.x,y:GROUND-(mo.tall?138:88),w:mo.tall?84:70,h:mo.tall?138:88},4)){mo.hit=true;if(motoHit(mo))return;}
    if(mo.x<dist-160)mo.state=3;
  }
  // fake finish line
  for(const f of S.fakes){
    if(f.state===0&&wx>f.x+60){f.state=1;f.t=0;SFX.fake();floatText(f.x+60,GROUND-200,'도착!',C_GOLD);}
    else if(f.state===1&&++f.t===34){f.state=2;floatText(dist+PX+60,GROUND-170,'속았지? ㅋㅋ','#ff7a6b');}
  }
  const cx=hb.x+hb.w/2;
  for(const it of S.items){
    if(it.got||Math.abs(it.x-cx)>28)continue;
    if(it.y>hb.y-20&&it.y<hb.y+hb.h+20){it.got=true;SFX.heal();
      if(hearts<3){hearts++;floatText(it.x,it.y-20,'체력 +1','#9be38f');}}
  }
  if(wx>S.len+40){saveBest(stageIdx+1);saveUnlock(stageIdx+1);SFX.clear();setState('clear');}
}

function updateFx(){
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--;}
  particles=particles.filter(q=>q.life>0);
  for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.vy+=0.4;d.rot+=d.vr;d.life--;}
  debris=debris.filter(d=>d.life>0);
  for(const f of floaters){f.y-=0.7;f.life--;}
  floaters=floaters.filter(f=>f.life>0);
  if(shake>0)shake--;
  if(S&&S.bolt&&S.bolt.t>0)S.bolt.t--;
}

function step(){
  frame++;stateT++;
  if(input.pause){if(state==='play')setState('pause');else if(state==='pause')setState('play');}
  switch(state){
    case 'title':if(input.jp||input.go)beginAt(unlocked);break;
    case 'intro':P.anim+=0.3;if(stateT>(tries>1?60:(S.def.flyTutorial?150:110)))setState('play');break;
    case 'play':updatePlay();break;
    case 'pause':if(input.go||input.jp)setState('play');break;
    case 'down':if(deathCause!=='sticky'){P.vy+=0.5;P.y=Math.min(P.y+P.vy,GROUND);if(P.y>=GROUND)P.vy=0;}if(stateT>(deathCause==='zap'?80:60)){saveBest(stageIdx+lastProg);setState('gameover');}break;
    case 'clear':{const s=Math.max(0,speed*(1-stateT/50));dist+=s;P.anim+=s*0.075;P.kickT=0;
      if(P.y<GROUND||P.vy<0){P.vy+=GRAV;P.y=Math.min(GROUND,P.y+P.vy);if(P.y>=GROUND)P.vy=0;}
      if(stateT>190)nextStage();break;}
    case 'gameover':if(stateT>25&&(input.jp||input.go))retryStage();break;
    case 'ending':if(stateT>50&&(input.jp||input.go))setState('title');break;
    case 'finale':updateFinale();if(stateT>180&&(input.jp||input.go))setState('title');break;
  }
  updateFx();
  input.jp=input.go=input.pause=input.kick=input.back=false;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function text(s,x,y,size,color,align,shadow){
  ctx.font=size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(shadow!==false){ctx.fillStyle='rgba(31,26,36,.75)';ctx.fillText(s,x+2,y+2);}
  ctx.fillStyle=color||C_PAPER;ctx.fillText(s,x,y);
}
function outlined(s,x,y,size,fill,stroke,lw){
  ctx.font=size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function bubble(label,x,y){
  ctx.font='17px '+FONT;const tw=ctx.measureText(label).width;
  ctx.fillStyle='rgba(31,26,36,.84)';rr(x-tw/2-12,y-16,tw+24,32,16);ctx.fill();
  text(label,x,y,17,C_PAPER,'center',false);
}

/* ---------- 태권송이 ---------- */
const OUT='#3b2b2b',DOBOK='#fbfaf5',DOBOK_SH='#dedad0',SKIN='#ffdcc2',HAIR='#2a1c18';

function limb2(root,a,b,len1,len2,color,bendBack){
  const j={x:root.x+Math.sin(a)*len1,y:root.y+Math.cos(a)*len1};

  const e={x:j.x+Math.sin(a2)*len2,y:j.y+Math.cos(a2)*len2};

  ctx.strokeStyle=OUT;ctx.lineWidth=8.5;ctx.beginPath();ctx.moveTo(root.x,root.y);ctx.lineTo(j.x,j.y);ctx.lineTo(e.x,e.y);ctx.stroke();

  ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(e.x,e.y,3.3,0,Math.PI*2);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=1.5;ctx.stroke();

}

function songiPose(){

function hills(c,f,base,amp,k,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,VH);
  for(let x=0;x<=VW+10;x+=10){const w=x+c*f;ctx.lineTo(x,base-Math.sin(w/k)*amp-Math.sin(w/(k*0.43)+1.7)*amp*0.4);}
  ctx.lineTo(VW,VH);ctx.closePath();ctx.fill();
}
function clouds(c,f,y0,color,scale){
  ctx.fillStyle=color;const span=VW+420;
  for(let i=0;i<5;i++){
    const x=((i*283-c*f)%span+span)%span-210,y=y0+(i*71)%80,s=scale*(0.8+((i*37)%10)/25);
    ctx.beginPath();
    ctx.moveTo(x+20*s,y);ctx.arc(x,y,20*s,0,Math.PI*2);
    ctx.moveTo(x+50*s,y-10*s);ctx.arc(x+24*s,y-10*s,26*s,0,Math.PI*2);
    ctx.moveTo(x+72*s,y);ctx.arc(x+52*s,y,20*s,0,Math.PI*2);
    ctx.fill();ctx.fillRect(x,y,52*s,20*s);
  }
}
function buildings(c,f,base,color,win,minH,maxH,wMin,seed,numbered){
  const span=1600,off=((c*f)%span+span)%span;
  for(let pass=0;pass<2;pass++){
    let x=-off+pass*span,i=0;
    while(x<pass*span-off+span&&x<VW+20){
      const hv=hash(i,seed),w=wMin+hv%50,h=minH+(hv>>7)%(maxH-minH);
      if(x+w>-10){
        ctx.fillStyle=color;ctx.fillRect(x,base-h,w,h);
        if(win){for(let wy=base-h+12;wy<base-10;wy+=16)for(let wx=x+8;wx<x+w-8;wx+=14){const on=hash(Math.floor(wx-x)+i*31,Math.floor(wy))%3!==0;if(typeof win==='string'?on:true){ctx.fillStyle=typeof win==='string'?win:'rgba(255,255,255,.35)';ctx.fillRect(wx,wy,6,8);}}}
        if(numbered){ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='12px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((101+i%9)+'동',x+w/2,base-h+8);}
      }
      x+=w+12+(hv>>3)%30;i++;
    }
  }
}

    ctx.moveTo(sx-r,sy);ctx.lineTo(sx+r,sy);ctx.moveTo(sx,sy-r);ctx.lineTo(sx,sy+r);ctx.stroke();

  ctx.save();ctx.translate(VW/2,58);ctx.scale(sc,sc);outlined('전설의 검은띠!',0,0,58,'#ffd23f','#2a1406',11);ctx.restore();
  if(t>25)text('태권송이 100 스테이지 완전 정복 · 금메달 획득!',VW/2,108,22,C_PAPER,'center');
  if(t>60)text('총 실패 '+totalDeaths+'회 · 끝까지 포기하지 않은 당신이 진짜 검은띠',VW/2,140,16,'#f3d9ff','center');
  if(t>180&&Math.floor(frame/30)%2===0)text(coarse?'탭하면 타이틀로':'Enter로 타이틀로',VW-90,VH-16,14,C_MUTED,'center');
  // confetti on top
  for(const c of FX.confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.r*2)));ctx.restore();}
}
function draw(){
  ctx.clearRect(0,0,VW,VH);
  if(state==='title'){drawTitle();return;}
  if(state==='finale'){drawFinale();return;}
  beltColor=BELTS[Math.min(9,(state==='clear'&&stateT>60)?stageIdx+1:stageIdx)][1];
  drawWorld();
  if(state==='intro'){
    ctx.fillStyle='rgba(31,26,36,.55)';ctx.fillRect(0,0,VW,VH);
    text('STAGE '+(stageIdx+1),VW/2,150,46,C_GOLD,'center');
    text(S.def.name,VW/2,202,32,C_PAPER,'center');
    const bi=Math.min(stageIdx,9),bt=stageIdx>=10?'검은띠 실전 '+(stageIdx-9):BELTS[bi][0]+' 도전';
    ctx.font='20px '+FONT;const bw2=ctx.measureText(bt).width;
    drawBeltIcon(VW/2-bw2/2-22,248,BELTS[bi][1],1);text(bt,VW/2-bw2/2+2,248,20,C_PAPER,'left');
    if(S.def.trapIntro)text(S.def.trapIntro.replace('{BACK}',coarse?'왼쪽으로 쓸면 뒤로 피하기':'← 키로 뒤로 피하기'),VW/2,296,22,'#ffd27a','center');
    else if(stageIdx===10)text('이제부터 검은띠 실전!',VW/2,296,22,'#ffd27a','center');
    else if(S.def.flyTutorial)text(coarse?'새 장애물! 날아오는 송판은 오른쪽으로 쓸어 발차기':'새 장애물! 날아오는 송판은 → 발차기로 격파',VW/2,296,20,'#ffd27a','center');
    else text(stateT<70?'준비…':'시작!',VW/2,296,26,stateT<70?C_MUTED:C_GOLD,'center');
  }
  else if(state==='pause')panel([{t:'일시정지',size:34,color:C_GOLD},{t:coarse?'화면을 탭하면 계속':'P 또는 Enter로 계속',size:18,color:C_MUTED}]);
  else if(state==='clear'&&stateT>60){
    const promo=stageIdx<9,b=promo?BELTS[stageIdx+1]:BELTS[9];
    const head=promo?b[0]+' 승급!':stageIdx===9?'검은띠 최종 심사 통과!':'검은띠 실전 '+(stageIdx-9)+' 통과!';
    panel([{t:head,size:promo?36:32,color:C_GOLD},{t:'STAGE '+(stageIdx+1)+' 클리어 · '+(tries===1?'한 번에 성공':tries+'번째 도전에 성공'),size:19},{t:STAGES[stageIdx+1]?'다음 · '+STAGES[stageIdx+1].name+(stageIdx+1===5?' (새 장애물 등장)':''):'',size:16,color:C_MUTED}],
      {h:34,draw:(x,y)=>drawBeltIcon(x,y,b[1],1.4)});
  }
  else if(state==='gameover'){
    const T={hit:['꽈당!',null],pit:['풍덩!',null],sticky:['끈끈이에 붙었다!','끈끈이는 2단 점프로 멀리 넘어가요'],zap:['벼락 맞았다!','여기는 2단 점프 금지 구역!'],ironkick:['발이 얼얼!','철판은 차지 말고 피하세요 (점프·슬라이드)'],iron:['철판에 맞았다!','철판은 높이를 따라오지 않아요'],ice:['미끄러져 꽈당!','빙판 위에서는 점프 금지!'],pot:['화분에 맞았다!','떨어지는 건 뒤로 피하기만 통해요'],pigeon:['비둘기 습격!','비둘기는 그냥 달려서 지나가요'],moto:['오토바이에 치였다!','짐이 낮으면 1단, 짐이 높으면 2단 점프!'],attn:['차렷 안 했지!','사범님이 차렷 하면 아무것도 누르지 마세요']}[deathCause];
    const L=[{t:T[0],size:38,color:'#ff9a7a'}];
    if(T[1])L.push({t:T[1],size:18,color:'#ffd27a'});
    L.push({t:'STAGE '+(stageIdx+1)+' · '+Math.floor(lastProg*100)+'% · 이 스테이지 '+tries+'번째 실패',size:19});
    L.push({t:(newBest?'최고 기록 갱신! · ':'')+'총 실패 '+totalDeaths+'회',size:16,color:newBest?'#9be38f':C_MUTED});    L.push({t:coarse?'탭하면 바로 다시':'Enter로 바로 다시',size:17,color:C_GOLD});
    panel(L);
  }
  else if(state==='ending')panel([{t:'검은띠 실전 1부 완주!',size:34,color:C_GOLD},{t:'60개 스테이지 통과 · 총 실패 '+totalDeaths+'회',size:21},{t:coarse?'탭하면 타이틀로':'Enter로 타이틀로',size:16,color:C_MUTED}],
      {h:34,draw:(x,y)=>drawBeltIcon(x,y,BELTS[9][1],1.4)});
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  acc+=dt;
  while(acc>=1/60){step();acc-=1/60;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  audioInit();
  const c=e.code;
  if(c==='Space'||c==='ArrowUp'||c==='KeyW'||c==='KeyZ'){e.preventDefault();if(!e.repeat)input.jp=true;}
  if(c==='ArrowDown'||c==='KeyS'){e.preventDefault();keys.down=true;}
  if(c==='ArrowRight'||c==='KeyD'||c==='KeyX'){e.preventDefault();if(!e.repeat)input.kick=true;}
  if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();if(!e.repeat)input.back=true;}
  if(c==='Enter'){e.preventDefault();input.go=true;}
  if((c==='KeyP'||c==='Escape')&&!e.repeat)input.pause=true;
});
window.addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;});
window.addEventListener('blur',()=>{keys.down=false;touch.gest=null;touch.id=null;if(state==='play')setState('pause');});

function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};}
function tryFullscreen(){
  if(!coarse||window.innerWidth<=window.innerHeight)return;
  const el=document.documentElement;
  if(document.fullscreenElement||!el.requestFullscreen)return;
  el.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(err){}setTimeout(fit,200);}).catch(()=>{});
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();cv.focus({preventScroll:true});tryFullscreen();
  if(touch.id!==null&&touch.id!==e.pointerId){if(state==='play')input.jp=true;return;}
  const p=toWorld(e);touch.id=e.pointerId;touch.x=p.x;touch.y=p.y;touch.downFrame=frame;touch.gest=null;
  touch.snap=P?{y:P.y,vy:P.vy,jumps:P.jumps,onGround:P.onGround,spin:P.spin}:null;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(state==='play')input.jp=true;else input.go=true;
});
// A tap jumps right away; if the finger then swipes, undo that jump and treat it as slide or kick.
function undoTapJump(){
  const s=touch.snap;
  if(!P||!s||lastJumpFrame<touch.downFrame||frame-touch.downFrame>14)return;
  if(s.onGround&&!overPit(dist+PXo())){P.y=GROUND;P.vy=0;P.onGround=true;P.jumps=0;P.spin=0;}
  else{P.jumps=s.jumps;P.vy=s.vy+GRAV*(frame-touch.downFrame);P.spin=s.spin;}
}
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==touch.id||touch.gest||state!=='play')return;
  const p=toWorld(e),dx=p.x-touch.x,dy=p.y-touch.y;
  if(dy>26&&dy>Math.abs(dx)){touch.gest='slide';undoTapJump();}
  else if(dx>26&&dx>Math.abs(dy)){touch.gest='kick';undoTapJump();input.kick=true;}
  else if(dx<-26&&-dx>Math.abs(dy)){touch.gest='back';undoTapJump();input.back=true;}
});
const endTouch=e=>{if(e.pointerId!==touch.id)return;touch.id=null;touch.gest=null;};
cv.addEventListener('pointerup',endTouch);cv.addEventListener('pointercancel',endTouch);cv.addEventListener('lostpointercapture',endTouch);
cv.addEventListener('contextmenu',e=>e.preventDefault());

const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'소리 켜기':'소리 끄기';cv.focus({preventScroll:true});});
document.getElementById('restart').addEventListener('click',()=>{audioInit();beginAt(0);cv.focus({preventScroll:true});});
// Test mode: open the page with #test at the end of the address.
if(location.hash==='#test'){
  const bar=document.getElementById('testbar'),sel=document.getElementById('stageSel'),chk=document.getElementById('godChk');
  bar.hidden=false;
  STAGES.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent='STAGE '+(i+1)+' · '+d.name+(i>=90?' (정전)':i>=80?' (차렷)':i>=70?' (오토바이)':i>=60?' (비둘기)':i>=50?' (낙하물)':i>=40?' (빙판)':i>=30?' (철판)':i>=20?' (벼락)':i>=10?' (끈끈이)':i>=5?' (송판)':'');sel.appendChild(o);});
  sel.value=String(unlocked);
  document.getElementById('stageGo').addEventListener('click',()=>{audioInit();beginAt(parseInt(sel.value,10));cv.focus({preventScroll:true});});
  chk.addEventListener('change',()=>{god=chk.checked;cv.focus({preventScroll:true});});
  window.addEventListener('keydown',e=>{
    if(e.code==='BracketRight'||e.code==='BracketLeft'){const n=clamp(stageIdx+(e.code==='BracketRight'?1:-1),0,STAGES.length-1);sel.value=String(n);beginAt(n);}
  });
}
})();
</script>
<script>
// App install (PWA): offline cache, Android "앱 설치" button, iPhone home-screen hint.
(function(){
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  var acts=document.querySelector('.actions'),bar=document.querySelector('.bar');
  var ib=document.createElement('button');ib.id='installBtn';ib.textContent='앱 설치';ib.hidden=true;acts.insertBefore(ib,acts.firstChild);
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;ib.hidden=false;});
  ib.addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;ib.hidden=true;});});
  window.addEventListener('appinstalled',function(){ib.hidden=true;});
  var standalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone){
    var h=document.createElement('div');h.className='pwa-hint';h.textContent='앱으로 설치: 사파리 공유 버튼 → "홈 화면에 추가"';bar.appendChild(h);
  }
})();
